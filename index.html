<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHANTOM Overlay</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay">

  <div class="team-panel">

    <div class="team-header">
      <img src="assets/phantom-logo.png" class="team-logo">
      <h1>PHANTOM</h1>
    </div>

    <div class="player">

      <div class="top">
        <span class="number">1</span>
        <span class="name" id="p1name">APIZ</span>
        <span class="kill">
            🔥 <span id="p1kill">0</span>
        </span>
      </div>

      <div class="hp-bar">
        <div class="hp-fill" id="p1hp"></div>
      </div>

      <div class="hp-text">
        <span id="p1hptext">200 / 200</span>
      </div>

    </div>

    <div class="player">

      <div class="top">
        <span class="number">2</span>
        <span class="name" id="p2name">HAQI</span>
        <span class="kill">
            🔥 <span id="p2kill">0</span>
        </span>
      </div>

      <div class="hp-bar">
        <div class="hp-fill" id="p2hp"></div>
      </div>

      <div class="hp-text">
        <span id="p2hptext">200 / 200</span>
      </div>

    </div>

    <div class="footer">

      <div>
        ALIVE
        <span id="alive">50</span>
      </div>

      <div>
        TOTAL KILL
        <span id="totalkill">0</span>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
